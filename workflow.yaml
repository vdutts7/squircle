# webp icon workflow — machine-parseable (public control plane)
flow:
  - install: |
      Use repo bin/ in place (or mirror elsewhere if you want).
      Venv: bin/.venv via bin/venv.zsh (or auto on --domain).
  - copy: "<repo>/webp/"
    note: "default out dir is REPO_ROOT/webp"
  - run: "./bin/squircle.sh <file|dir>; default size 1024"
  - verify: "./bin/test/run-all.sh"
  - commit: "pre-commit blocks unless normalized"

normalized:
  path: "webp/<name>.webp"
  size: 1024x1024
  format: webp
  metadata: stripped

hook:
  allow: ["webp/**/*.webp @ 1024x1024", "non-image files in root"]
  block: ["webp/**/*.{png,icns,...}", "root images", "webp/**/*.webp !1024x1024"]
  on_allow: "strip metadata"

layout:
  root: "config, docs, bin, hooks, registry"
  planes:
    control: "workflow.yaml + repo.spine.json"
    data: "registry/ (manifest, tests, edge-case-matrix)"
    execution: "bin/ + bin/test/ + .hooks/"
  webp: "flat CDN at webp/*.webp; bulk packs only in webp/material-icons/ — see webp-naming.config.json"

verify:
  runner: "bin/test/run-all.sh"
  registry: "registry/tests.json"
  edge_case_matrix: "registry/edge-case-matrix.json"

related_workflows:
  - "workflows/clip-queue.yaml (operation profile for --clip-queue tuning/reruns)"
  - "workflows/logo-fetch-phash-pipeline.yaml (planned domain logo-fetch + pHash pipeline)"
