# webp icon workflow — machine-parseable
flow:
  - install: |
      Namespace tools under $CURTOOLS/squircle/ (same layout as repo bin/): rsync -a --delete bin/ "$CURTOOLS/squircle/"
      Venv: $CURTOOLS/squircle/.venv (venv.zsh or auto on --domain). Python deps only beside squircle.sh + system python3.
      From a project checkout that has webp/, export SQUIRCLE="$PWD" so outputs go there (your shell can set this when webp/ exists).
      Example: squircle () { [[ -d "$PWD/webp" ]] && export SQUIRCLE="$PWD"; "$CURTOOLS/squircle/squircle.sh" "$@" }
  - copy: "<repo>/webp/"
    note: "squircle defaults to REPO_ROOT/webp; with $CURTOOLS/squircle/ scripts, set SQUIRCLE to the checkout (see install example)"
  - run: "squircle <file>  OR  squircle <dir> (batch, parallel); default size 1024"
  - commit: "pre-commit blocks unless normalized"

normalized:
  path: "webp/<name>.webp"
  size: 1024x1024
  format: webp
  metadata: stripped

hook:
  allow: ["webp/**/*.webp @ 1024x1024", "non-image files in root"]
  block: ["webp/**/*.{png,icns,...}", "root images", "webp/**/*.webp !1024x1024"]
  on_allow: "strip metadata"

layout:
  root: "config, docs, bin, hooks"
  bin: "repo bin/* → install copy at $CURTOOLS/squircle/* (flat mirror); .venv lives in squircle/"
  webp: "flat CDN at webp/*.webp; bulk packs only in webp/material-icons/ — see webp-naming.config.json"

related_workflows:
  - "workflows/clip-queue.yaml (operation profile for --clip-queue tuning/reruns)"
  - "workflows/logo-fetch-phash-pipeline.yaml (planned domain logo-fetch + pHash pipeline)"
